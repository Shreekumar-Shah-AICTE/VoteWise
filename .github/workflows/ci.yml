name: CI — VoteWise Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (strict — zero warnings)
        run: npm run lint

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run TypeScript type-check (strict mode)
        run: npm run type-check

      - name: Run test suite (259 tests, 11 suites)
        run: npm test

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify build artifacts
        run: |
          test -d .next && echo "✅ Build successful"
          test -d .next/standalone && echo "✅ Standalone output generated"
